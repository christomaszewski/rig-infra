name: certify
# The rig launcher contract as an executable gate (the camera-service pattern): check out rig, run
# `rig certify --repo` against every service dir. Certify runs each launcher's `config` verb under a
# poisoned fleet env and asserts the contract held — project name honored, images pulled from
# RIG_IMAGE_REGISTRY, BUILT images pulled as :RIG_IMAGE_TAG (build/pull agreement with base/build.sh),
# fleet ROS env unmangled, deterministic output, identity derived from the config name.
#
# The last two steps cover what certify structurally cannot: certify pops RIG_BASE_IMAGE (the
# deployment's base image is optional, and launchers carry a fallback), so both sides of that
# contract — the composes RUNNING an exported base, and base/build.sh honoring the rig-owned build
# env — are checked here directly.
on:
  push: { branches: [main] }
  pull_request:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: christomaszewski/rig
          path: .rig
      - run: python3 -m pip install --user pyyaml
      # Each service's declared `examples:` is certify's default --config.
      - name: certify zenoh-router
        run: ./.rig/rig certify --repo zenoh-router
      # The router's second config path: an inline `router_config:` renders + mounts a zenohd.json5.
      - name: certify zenoh-router (router_config path)
        run: |
          printf 'service: zenoh-router\nname: zr\nrouter_config:\n  scouting: {multicast: {enabled: false}}\n' > /tmp/zr.yaml
          ./.rig/rig certify --repo zenoh-router --config /tmp/zr.yaml
      - name: certify ros2-bag-logger
        run: ./.rig/rig certify --repo ros2-bag-logger
      # The logger's second config path: a `graph:` block gates the graph-snapshotter sidecar
      # (profile-gated compose service + GRAPH_SNAPSHOT_* env exports).
      - name: certify ros2-bag-logger (graph path)
        run: |
          printf 'service: ros2-bag-logger\nname: bl\ngraph:\n  enabled: true\n  interval_s: 30\n' > /tmp/bl.yaml
          ./.rig/rig certify --repo ros2-bag-logger --config /tmp/bl.yaml
      # The graph-snapshotter's pure core (epoch dedup/hash/schema — the rig v0.2.32 reader is
      # built against fixtures of exactly this schema) and the `graph:` config gate.
      - name: ros2-bag-logger unit tests
        run: python3 ros2-bag-logger/tests/test_graph_snapshot.py
      # The player renders against a source run (session resolution is host-side, §1.3 of the
      # replay handoff) and the example config's source.run is empty ON PURPOSE — the source is
      # rig's channel. Certify passes the caller's env through, so hand it a fabricated run.
      - name: certify ros2-bag-player
        run: |
          mkdir -p /tmp/replay-src/bags/bag_logger/bag_logger_20260101T000000Z
          touch /tmp/replay-src/bags/bag_logger/bag_logger_20260101T000000Z/certify_0.mcap
          # v1.12.0: a window or a call script reads the session's metadata.yaml host-side (the
          # bag start is the injector's one zero; the duration bounds the window) — fabricate it.
          printf 'rosbag2_bagfile_information:\n  version: 9\n  storage_identifier: mcap\n  duration: {nanoseconds: 120000000000}\n  starting_time: {nanoseconds_since_epoch: 1767225600000000000}\n  topics_with_message_count: []\n' \
            > /tmp/replay-src/bags/bag_logger/bag_logger_20260101T000000Z/metadata.yaml
          RIG_REPLAY_SOURCE=/tmp/replay-src ./.rig/rig certify --repo ros2-bag-player
      # The player's service-call paths (rig-replay-calls-handoff §1, rig >= v0.2.37): verbatim
      # service playback rides the topic session's env; a call script activates the injector's
      # `calls` compose profile (gated on `up` only — `config` renders the player alone, like
      # the logger's graph path).
      - name: certify ros2-bag-player (services + calls paths)
        run: |
          printf 'schema: 1\ncalls: []\n' > /tmp/calls.yaml
          RIG_REPLAY_SOURCE=/tmp/replay-src RIG_REPLAY_TOPICS="/a /b" \
            RIG_REPLAY_SERVICES="/planner/set_mode" ./.rig/rig certify --repo ros2-bag-player
          RIG_REPLAY_SOURCE=/tmp/replay-src RIG_REPLAY_CALLS=/tmp/calls.yaml \
            ./.rig/rig certify --repo ros2-bag-player
      # The window path (rig-replay-window-handoff §1, rig >= v0.2.46): RIG_REPLAY_FROM_S/TO_S ->
      # --start-offset + --playback-duration, validated against the fabricated metadata.yaml, and
      # play.sh grows the latch pre-pass block (tools/latch_restore.py mounted into the player).
      - name: certify ros2-bag-player (window path)
        run: |
          RIG_REPLAY_SOURCE=/tmp/replay-src RIG_REPLAY_FROM_S=30 RIG_REPLAY_TO_S=45 \
            RIG_REPLAY_TOPICS="/a /b" ./.rig/rig certify --repo ros2-bag-player
      # The player's pure cores — the selector doctrine (TOPICS xor EXCLUDE, allow-mode
      # filtering, clock-knob refusal) rig v0.2.33's `rig replay` is built against, plus the
      # v1.10.0 service-call layer: the §1.1 refusal matrix, the injector's strict script
      # schema + results contract, and export-calls' schema-v1 emission (round-tripped through
      # the injector's own parser) rig v0.2.37 is built against — plus the v1.12.0 window layer
      # (env -> flags, refuse/clamp against metadata, the latch topic-set intersection, the
      # injector's window filter + one-zero time base) rig v0.2.46 is built against.
      - name: ros2-bag-player unit tests
        run: |
          python3 ros2-bag-player/tests/test_play_cmd.py
          python3 ros2-bag-player/tests/test_play_cmd_services.py
          python3 ros2-bag-player/tests/test_call_injector.py
          python3 ros2-bag-player/tests/test_export_calls.py
          python3 ros2-bag-player/tests/test_play_cmd_window.py
          python3 ros2-bag-player/tests/test_latch_restore.py
      - name: certify ros1-bag-logger
        run: ./.rig/rig certify --repo ros1-bag-logger
      # RIG_BASE_IMAGE, consumer side: with a base exported the stacks RUN it; with none — certify's
      # view, and a standalone `docker compose` — they fall back to the composed fleet-ros pull ref.
      # A per-instance ${<SVC>_IMAGE} override still beats both.
      - name: composes honor RIG_BASE_IMAGE
        env:
          RIG_IMAGE_REGISTRY: devbox:5000
          RIG_IMAGE_TAG: v1.3.0
        run: |
          set -eu
          rendered() {   # <base-ref-or-empty> <service> [EXTRA=VAL ...] -> the compose's image ref
            base="$1"; svc="$2"; shift 2
            [ -z "$base" ] || set -- "RIG_BASE_IMAGE=$base" "$@"
            env "$@" "./$svc/$svc-up" "$svc/config/$svc.example.yaml" config \
              | sed -n 's/^ *image: //p'   # launcher banners go to stderr -> the step log, not here
          }
          expect() {     # <label> <want> <got>
            [ "$2" = "$3" ] || { echo "::error::$1: expected '$2', got '$3'"; exit 1; }
            echo "  ok  $1 -> $3"
          }
          BASE=nvcr.io/vendor/l4t-ros:36.4
          for svc in zenoh-router ros2-bag-logger; do
            expect "$svc fallback (certify's view)" "devbox:5000/fleet-ros:v1.3.0" "$(rendered '' $svc)"
            expect "$svc runs the base"             "$BASE"                        "$(rendered $BASE $svc)"
          done
          expect "instance override wins" "eclipse/zenoh:1.2.1" \
                 "$(rendered $BASE zenoh-router ZENOH_ROUTER_IMAGE=eclipse/zenoh:1.2.1)"

      # Provider side: the fleet-ros build script parses, opts into `rig build --no-cache`, installs
      # the rmw the fleet declares (RIG_ROS_RMW, rig >= v0.2.23), and ignores RIG_BASE_IMAGE —
      # fleet-ros IS the base, so the stage-0 build must stay FROM the stock ROS base even if the
      # variable leaks in. A stub `docker` on PATH records the argv, so this needs no daemon and no
      # registry (the real build/push only runs against one).
      - name: base/build.sh syntax + build env contract
        run: |
          set -eu
          sh -n base/build.sh
          mkdir -p /tmp/stub
          cat > /tmp/stub/docker <<'STUB'
          #!/bin/sh
          echo "docker $*" >> /tmp/stub/argv
          STUB
          chmod +x /tmp/stub/docker
          export PATH=/tmp/stub:$PATH ROS_DISTRO=lyrical
          build() {   # <label> <expected rmw> [ENV=VAL ...] — run build.sh, assert the rmw build-arg
            label="$1"; want="$2"; shift 2
            : > /tmp/stub/argv
            env "$@" ./base/build.sh devbox:5000 v1.3.0
            grep -q -- "--build-arg RMW_IMPLEMENTATION=$want" /tmp/stub/argv || {
              echo "::error::$label: expected RMW_IMPLEMENTATION=$want"; cat /tmp/stub/argv; exit 1; }
            echo "  ok  $label -> $want"
          }
          # rmw precedence: rig's var wins, the standalone knob is the fallback, then the default.
          build "RIG_ROS_RMW (rig-wired)"   rmw_cyclonedds_cpp RIG_ROS_RMW=rmw_cyclonedds_cpp
          build "FLEET_ROS_RMW (standalone)" rmw_fastrtps_cpp  FLEET_ROS_RMW=rmw_fastrtps_cpp
          build "RIG_ROS_RMW beats FLEET_ROS_RMW" rmw_cyclonedds_cpp \
                RIG_ROS_RMW=rmw_cyclonedds_cpp FLEET_ROS_RMW=rmw_fastrtps_cpp
          build "neither set -> zenoh default" rmw_zenoh_cpp
          # --no-cache is opt-in, and --pull rides with it: a deliberate refresh must re-pull the
          # ros base parent (the version authority) or the "fresh" build reuses the stale local
          # parent. RIG_BASE_IMAGE must NOT reach the base build even when it leaks in.
          : > /tmp/stub/argv
          RIG_BUILD_NO_CACHE=1 ./base/build.sh devbox:5000 v1.3.0
          grep -q -- 'docker build --no-cache --pull .*--build-arg ROS_DISTRO=lyrical' /tmp/stub/argv || {
            echo "::error::RIG_BUILD_NO_CACHE=1 did not reach docker build as --no-cache --pull"; cat /tmp/stub/argv; exit 1; }
          : > /tmp/stub/argv
          RIG_BASE_IMAGE=nvcr.io/vendor/l4t-ros:36.4 ./base/build.sh devbox:5000 v1.3.0
          ! grep -qE -- '--no-cache|--pull|nvcr\.io' /tmp/stub/argv || {
            echo "::error::the base build consumed a variable it must ignore"; cat /tmp/stub/argv; exit 1; }
          echo "  ok  build.sh: --no-cache --pull opt-in, RIG_BASE_IMAGE ignored"
