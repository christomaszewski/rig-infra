# The vehicle's shared ROS 2 bag logger (infra) — ONE per vehicle. rig brings it up just after the zenoh
# router so it records the graph from the start, and tears it down last so it captures shutdown. The bag
# goes to ${RIG_DATA_DIR}/bags/<name> (a real host path → survives `rig down --purge`).
#
# IMAGE: must have BOTH rosbag2 (`ros2 bag`) AND rmw_zenoh_cpp so the logger joins the same graph as
# the drivers (on localhost:7447, host networking). The default fleet-ros base image (../base) carries
# exactly that; point BAG_LOGGER_IMAGE at a driver image only if you prefer reusing one that already has
# both. The recorder runs via `command:` so the image's ROS-sourcing entrypoint still runs; record.sh
# also sources ROS defensively.
#
# Resolution, outermost first: BAG_LOGGER_IMAGE (this instance's explicit override) -> RIG_MSGS_IMAGE
# (the deployment's fleet-ros-msgs interface overlay — base + the custom message packages the fleet's
# services declare, which the recorder MUST have installed to record their topics; see ../../msgs/.
# rig >= v0.2.28 builds it via this rigging's `msgs_overlay` and exports the var whenever the
# fleet declares `msgs:` blocks; standalone or on older rigs, export it yourself or set
# BAG_LOGGER_IMAGE) -> RIG_BASE_IMAGE (the DEPLOYMENT's base image — rig exports it from this
# rigging's `provides: base`, or from vehicle.yaml `images.base` when the fleet declares an external
# one; recording from the fleet's base is how the logger's rmw packages stay identical to the
# router's) -> the composed fleet-ros pull ref, which is what certify renders (it never inherits
# RIG_MSGS_IMAGE or RIG_BASE_IMAGE — both optional, so the fallback must carry) and what a standalone
# `docker compose` outside rig gets. An external base must still carry rosbag2 + the fleet's rmw —
# `rig image audit` checks exactly that.
services:
  bag-logger:
    image: ${BAG_LOGGER_IMAGE:-${RIG_MSGS_IMAGE:-${RIG_BASE_IMAGE:-${RIG_IMAGE_REGISTRY:+${RIG_IMAGE_REGISTRY}/}fleet-ros:${RIG_IMAGE_TAG:-latest}}}}
    network_mode: host            # join the graph / reach the zenoh router at localhost:7447
    restart: unless-stopped
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_zenoh_cpp}
      VEHICLE_ID: ${VEHICLE_ID:-}
      RIG_BAG_ROOT: /data
    volumes:
      # The DATA ROOT is mounted (not just bags/) so the recorder can resolve the run registry's
      # `current` symlink (relative target `runs/<id>` -> stays inside the mount). Run-aware output:
      # <data>/current/bags/<name>; flat <data>/bags/<name> when no registry exists.
      - ${RIG_DATA_DIR:-/data}:/data
      - ${BAG_RECORD_SCRIPT:?set by ros2-bag-logger-up}:/record.sh:ro
    command: ["/bin/bash", "/record.sh"]   # bash, not sh: record.sh sources ROS `setup.bash` (bash-only)

  # graph-snapshotter — the logger's topology sidecar: records the live ROS 2 graph (per-node
  # pubs/subs/service servers/clients) as append-only, change-deduped epoch files at
  # <data>/current/graph/<name>/epoch_<UTCstamp>.yaml (flat graph/<name> without a run registry) —
  # bags record data, this records who talked to what; `rig graph` / `rig replay` consume the YAML.
  # Profile-gated: ros2-bag-logger-up adds `--profile graph` on `up` when the config's `graph:`
  # block enables it (and unconditionally on down/status/logs/ps, so a sidecar from a
  # since-disabled config is still torn down). Same image chain and env as the logger — the sidecar
  # introspects custom types wherever the recorder does; parameters travel by env, no render step.
  graph-snapshotter:
    profiles: ["graph"]
    image: ${BAG_LOGGER_IMAGE:-${RIG_MSGS_IMAGE:-${RIG_BASE_IMAGE:-${RIG_IMAGE_REGISTRY:+${RIG_IMAGE_REGISTRY}/}fleet-ros:${RIG_IMAGE_TAG:-latest}}}}
    network_mode: host            # observe the same graph the drivers are on
    restart: unless-stopped       # a restart opens a NEW epoch by design (never resumes a file)
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_zenoh_cpp}
      VEHICLE_ID: ${VEHICLE_ID:-}
      RIG_BAG_ROOT: /data
      GRAPH_SNAPSHOT_NAME: ${GRAPH_SNAPSHOT_NAME:-bag_logger}
      GRAPH_SNAPSHOT_INTERVAL_S: ${GRAPH_SNAPSHOT_INTERVAL_S:-60}
      GRAPH_SNAPSHOT_SETTLE_S: ${GRAPH_SNAPSHOT_SETTLE_S:-2}
    volumes:
      - ${RIG_DATA_DIR:-/data}:/data
      - ../tools/graph_snapshot.py:/graph_snapshot.py:ro   # static tool — no render, mounted from the repo
    # Source ROS defensively before exec'ing python3 (the record.sh pattern — the image's
    # entrypoint usually did it already, since we run as `command:`). $$ = literal $ for the
    # container shell: these expand IN the container, never at compose-interpolation time.
    command: ["/bin/bash", "-c",
              "[ -n \"$${ROS_DISTRO:-}\" ] && [ -f \"/opt/ros/$$ROS_DISTRO/setup.bash\" ] && . \"/opt/ros/$$ROS_DISTRO/setup.bash\"; exec python3 /graph_snapshot.py"]
