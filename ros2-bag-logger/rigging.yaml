# rig descriptor for the vehicle's shared ROS 2 bag logger (infra tier — up just after the zenoh router,
# down last). Records the telemetry graph; image topics excluded by default (see the example config).
service: ros2-bag-logger
launcher: ros2-bag-logger-up
verbs:
  up: "up -d"
  down: "down"
  status: "ps"
  logs: "logs"
  config: "config"
ros_distro: lyrical
tier: infra
examples: [config/ros2-bag-logger.example.yaml]   # default config for `rig certify --repo`; copied by `rig init`
# Default image: the shared fleet-ros base (rosbag2 + mcap + rmw_zenoh, ~1 GB) — a camera-less vehicle
# no longer pulls a 3+ GB driver image just to record bags. `rig build` builds + pushes it; certify
# enforces the compose pulls it as :RIG_IMAGE_TAG. Override via BAG_LOGGER_IMAGE (e.g. a driver image
# that already carries both — then swap this `build:` for a `mirror:` of whatever you point at).
#
# `provides: base` (rig >= v0.2.21) declares fleet-ros the DEPLOYMENT's base image — the same
# declaration zenoh-router carries, naming the same image from the same script, so rig treats them
# as ONE base: built first, exported to every other build and launcher as RIG_BASE_IMAGE. Keeping it
# on BOTH riggings is deliberate: either service alone in a deployment still supplies the fleet's
# base. (vehicle.yaml `images.base` overrides it with an external ref; rig then skips this build.)
build: { command: ../base/build.sh, images: [fleet-ros], provides: base }
launch_surface:
  - ros2-bag-logger-up
  - tools/bag_cmd.py
  - docker/compose.deploy.yaml
  - docker/compose.shm.yaml   # applied only when the config effectively enables zenoh shared memory
