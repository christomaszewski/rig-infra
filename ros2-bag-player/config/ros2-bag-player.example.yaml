# SIL replay: play a selected topic subset from a SOURCE run's bags into the live graph. Under
# `rig replay` this row lives in vehicle.yaml `autonomy:` with enabled: false and a HIGH order
# (~999): the player must come up LAST (subscribers exist before data flows) and go down FIRST —
# rig names it explicitly, so the disabled row never starts on a normal `rig up`. The player
# never decides what to play: rig exports RIG_REPLAY_SOURCE + RIG_REPLAY_TOPICS (allow-list from
# graph epochs) | RIG_REPLAY_EXCLUDE (namespace-heuristic fallback) — exactly one, both-set is
# refused — and everything below is the STANDALONE fallback for driving the player by hand.
# An exited (0) player is a FINISHED replay, not a failure.
service: ros2-bag-player
name: bag_player

source:
  run: ""                # abs host path to a run dir — STANDALONE use only; RIG_REPLAY_SOURCE wins.
  #                        Mounted READ-ONLY at /replay; the player cannot write the source run.
  logger: bag_logger     # which bags/<logger>/ tree of the source run to play (the logger config's `name`)
  session: latest        # latest | <UTCstamp> — the stamped recording dir under bags/<logger>/.
  #                        latest = lexically-greatest stamp; multiple sessions WARN naming the
  #                        skipped ones (each is one recording; play them one `up` at a time).
  #                        A recording split into multiple files plays as ONE session.

play:
  topics: []             # standalone allow-list (exact topic names); RIG_REPLAY_TOPICS shadows it
  #                        (WARN). Empty + no excludes = play everything in the session.
  #                        Topics named here but absent from the bag are tolerated, not an error.
  exclude: []            # regex excludes — applied in BOTH modes: they FILTER the allow-list
  #                        before --topics (never an allow flag and an exclude flag together), or
  #                        merge with RIG_REPLAY_EXCLUDE into one alternation for -x.
  rate: 1.0              # playback speed multiplier (> 0). Also scales /clock under sim time.
  loop: false            # wrap forever — soak testing, NOT fidelity: /clock jumps backwards at
  #                        the wrap (TF and anything stateful will object), and with the
  #                        compose's restart: "no" `down` becomes the only exit (the launcher WARNs)
  start_offset_s: 0      # STANDALONE window start: seconds from BAG START (metadata starting_time;
  #                        float ok). Under `rig replay --from S` RIG_REPLAY_FROM_S shadows a
  #                        non-zero value here (WARN) — windows are SELECTION, so rig records them
  #                        in the replay manifest instead. >= the bag's duration is refused. With a
  #                        start > 0 play.sh first runs the LATCH PRE-PASS (tools/latch_restore.py):
  #                        rosbag2's --start-offset skips every transient-local message recorded
  #                        before the offset (/tf_static, maps…), so each SELECTED latched topic's
  #                        last pre-window value is republished with its recorded QoS from a node
  #                        that stays alive for the session. NOTE a window cuts service STATE —
  #                        a mode set at t=29.5 is not set in a replay from t=30; script such
  #                        calls at t == start in a call script (they fire at window start).
  end_offset_s: 0        # STANDALONE window end, EXCLUSIVE, seconds from bag start; 0 = the bag
  #                        end. RIG_REPLAY_TO_S shadows a non-zero value (WARN). Past the bag end
  #                        WARNs and clamps to it (sweeps hit the end naturally); <= the start is
  #                        an empty window and refused. Maps to --playback-duration (end − start),
  #                        RECORDED seconds; the player exits 0 at the window end.
  start_paused: false    # come up subscribed but hold data until resumed via rosbag2's own player
  #                        services (/rosbag2_player/{pause,resume,toggle_paused,...})
  services: []           # VERBATIM service playback: recorded requests re-issued at live servers
  #                        (--publish-service-requests + this allow-list). Standalone only;
  #                        RIG_REPLAY_SERVICES shadows it (WARN — rig computes the with-set's
  #                        observed provides minus requires). Services absent from the bag are
  #                        tolerated. Responses go to the PLAYER, not to original callers — this
  #                        replays calls AT servers. Mutually exclusive with `calls:` below.
  services_source: service  # service | client — which side's recorded `_service_event`s requests
  #                        are reconstructed from (servers under test adopted introspection; their
  #                        callers may not have). Also governs the `export-calls` verb.
  # NO clock knob, on purpose: --clock derives from rig's RIG_SIM_TIME alone (one rig-owned
  # token, two consumers — the player's /clock and the services' use_sim_time). Declaring
  # play.clock here is refused at parse; standalone sim-time runs export RIG_SIM_TIME=1 instead.

# calls: /abs/path/to/calls.yaml
#                      # The CALL INJECTOR (script mode — subsumes verbatim playback, and setting
#                        both this and play.services is refused): a schema-v1 call-script YAML
#                        (bootstrap one with `ros2-bag-player-up <config> export-calls`, then
#                        retime/edit/inject), executed on the replay clock — `t` counts from
#                        BAG START (the one zero: metadata starting_time, the same zero
#                        export-calls writes and the window above counts in; /clock − bag start
#                        under RIG_SIM_TIME, start + wall elapsed otherwise). A window FILTERS
#                        the script: calls before the start are skipped, calls at/after the end
#                        never reached — both named in one leading `# window:` comment line of
#                        results.yaml. Mounted read-only; results append to
#                        <run>/calls/<name>/results.yaml. Standalone only; RIG_REPLAY_CALLS
#                        shadows it (WARN). Injector exit 0 = a finished timeline, not a failure.
