# rig descriptor for the SIL replay bag player. tier: autonomy is LOAD-BEARING, not cosmetic: the
# vehicle.yaml row lives in the `autonomy:` list with a high order (rig replay declares it
# enabled: false, order ~999 — explicit names win in selection), so the player comes up LAST
# (the services under test have their subscriptions standing before data flows; volatile
# durability would silently drop the bag head) and goes down FIRST (stop feeding before stopping
# consumers). The player never decides what to play — `rig replay` (or the standalone config)
# hands it the set; see config/ros2-bag-player.example.yaml.
service: ros2-bag-player
launcher: ros2-bag-player-up
verbs:
  up: "up -d"
  down: "down"
  status: "ps"
  logs: "logs"
  config: "config"
  images: "images"
  runtime-images: "runtime-images"
  replay-capabilities: "replay-capabilities"
  replay-reindex: "replay-reindex"
  replay-inspect-calls: "replay-inspect-calls"
ros_distro: lyrical
tier: autonomy
examples: [config/ros2-bag-player.example.yaml]   # default config for `rig certify --repo`; copied by `rig init`
# Default image: the shared fleet-ros base — the SAME image (and msgs overlay preference, see the
# compose) the bag logger records under, so every recorded type deserializes by construction. No
# new image and no `provides: base` here: the player rides whatever base the fleet's
# logger/router riggings already provide; declaring the build ref only names the fallback build.
build: { architectures: [arm64, amd64], capabilities: {no_cache: true, platforms: true}, command: ../base/build.sh, images: [fleet-ros] }
launch_surface:
  - tools/runtime_images.py
  - ros2-bag-player-up
  - tools/play_cmd.py
  - tools/call_injector.py   # the call injector's tool (mounted, not rendered — the graph-snapshotter pattern)
  - tools/export_calls.py    # the export-calls one-shot's tool (mounted into the player)
  - tools/latch_restore.py   # the latch pre-pass of a windowed replay (mounted into the player)
  - tools/release_gate.py    # the release gate of a gated replay (mounted into the player; RIG_REPLAY_START_AT_UNIX_S)
  - tools/clock_only.py
  - tools/reindex.py
  - tools/inspect_calls.py
  - tools/inspect_calls_host.py
  - docker/compose.deploy.yaml
  - tools/replay_coordination.py
  - tools/coordinated_player.py
  - tools/replay_readiness.py
  - docker/compose.coordinated.yaml
