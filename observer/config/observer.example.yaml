service: observer
name: observer

graph:
  enabled: true
  endpoints: true
  interval_s: 60
  settle_s: 2
system:
  enabled: true
  interval_s: 1             # minimum 0.1 seconds
  settings_interval_s: 30   # minimum 1 second
recording:
  enabled: true
diagnostics:
  enabled: true
  topic: /diagnostics
  interval_s: 1
  stale_after_s: 5
  components: [cpu, memory, storage, temperature, gpu, power, host, recording, collectors]
  thresholds: {}
  # Host measurements are wall-clock observations. Replay publishing is opt-in;
  # its diagnostic instance becomes <name>_replay_host to distinguish source data.
  publish_during_replay: false

# Capture-only: set diagnostics.enabled: false.
# Diagnostics-only: set graph.enabled: false and recording.enabled: false.
# Keep system.enabled: true for diagnostics; no open run is required in that mode.
