# Overlay applied by zenoh-router-up ONLY when the instance config carries an inline `router_config:`
# mapping (rendered to var/run/<name>/zenohd.json5 — pure JSON, a JSON5 subset — and mounted read-only).
# rmw_zenohd (the default command in compose.deploy.yaml) reads ZENOH_ROUTER_CONFIG_URI; a standalone
# eclipse/zenoh image instead takes `-c` — uncomment the command below (it replaces the deploy one).
services:
  router:
    environment:
      ZENOH_ROUTER_CONFIG_URI: /zenohd.json5
    volumes:
      - ${ZENOH_ROUTER_CONFIG_FILE:?set by zenoh-router-up}:/zenohd.json5:ro
    # command: ["-c", "/zenohd.json5"]   # standalone eclipse/zenoh only (plain zenohd has no URI env)
