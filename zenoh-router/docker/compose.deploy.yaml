# The vehicle's shared Zenoh router — ONE per vehicle, brought up first by rig. ROS 2 stacks using
# rmw_zenoh connect on localhost:7447 (host networking).
#
# Default: the fleet-ros base image running the rmw_zenoh-provided router (`rmw_zenohd`) — full ROS
# fidelity, and the router + sessions share one distro's zenoh packages by construction (rig build
# pushes fleet-ros; certify enforces the tag agreement).
#
# Standalone alternative: set ZENOH_ROUTER_IMAGE to a PINNED eclipse/zenoh (e.g. eclipse/zenoh:1.2.1,
# never :latest) — its own entrypoint runs `zenohd`, so ALSO comment out the `command:` below (and see
# the `-c` note in compose.config.yaml if you use an inline `router_config:`).
services:
  router:
    image: ${ZENOH_ROUTER_IMAGE:-${RIG_IMAGE_REGISTRY:+${RIG_IMAGE_REGISTRY}/}fleet-ros:${RIG_IMAGE_TAG:-latest}}
    network_mode: host            # nodes reach the router at localhost:7447
    restart: unless-stopped
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_zenoh_cpp}
      VEHICLE_ID: ${VEHICLE_ID:-}
    command: ["ros2", "run", "rmw_zenoh_cpp", "rmw_zenohd"]   # comment out for standalone eclipse/zenoh
